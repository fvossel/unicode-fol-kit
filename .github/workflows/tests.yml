name: Tests

# The fast suite: every test EXCEPT the serial live batteries — isabelle_live
# (real `isabelle build` subprocesses, own workflow isabelle-tests.yml) and
# hets_live (a running HETS server; no runner has one). Parallel via
# pytest-xdist; the pyproject marker comment explains why -n never goes into
# addopts (the live suites must stay serial).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fast:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        include:
          # One Windows leg: the primary dev box is Windows, so path handling
          # and subprocess quirks get coverage where they actually differ.
          - os: windows-latest
            python-version: '3.11'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      # E (eprover, universe) is installed so the eprover backend's live
      # tests can run for real. NOTE: Ubuntu's eprover 3.0.03 currently
      # aborts on every problem —
      #   che_proofcontrol.c:163: sat_solver_init: Assertion `status' failed.
      # — so those tests SKIP with the crash text rather than fail (see
      # tests/test_eprover_zipperposition.py::_skip_if_the_binary_crashed).
      # The step stays: the moment the packaged prover works, the live
      # coverage comes back by itself. Until then, do not read a green run
      # as evidence that the E backend was exercised against a real E.
      # Linux-only (apt/sudo; the Windows leg skips via discovery) and
      # non-fatal on purpose — a mirror hiccup must not fail the suite.
      - name: Install E prover (live backend coverage)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq eprover || true

      - name: Run the fast suite
        run: pytest -n auto -m "not isabelle_live and not hets_live"
