name: Publish to PyPI

# A tag `v*` publishes the commit it points at, and only a commit whose tests
# are green.
#
# The first job starts no tests. It looks for a run of the Tests workflow
# (tests.yml) on the tagged commit: a green one lets the release through, one
# that is still running is waited for, and a red one, or none at all, ends the
# release before anything is built. So the order of work stays "push main, see
# it green, push the tag"; a tag pushed too early waits instead of publishing
# untested code; and the suite never runs twice for one commit. A commit pushed
# with `[skip ci]` has no run, so a tag cannot release it.
#
# The second job uploads two distributions: unicode-logic-kit, built from the
# repository root, and unicode-fol-kit, the forwarder for the former name
# (directory unicode-fol-kit/). The forwarder's version does not change, so
# after its first upload `--skip-existing` passes over it.
#
# It also creates the GitHub Release of the tag, with the changelog section as
# its text (tools/release_notes.py). A release that this workflow's own token
# creates starts no further workflow, and this workflow does not listen for
# releases, so publishing one by hand uploads nothing.
#
# `workflow_dispatch` runs the release of an existing tag again, through the
# same gate: after a failed upload, or once a red Tests run has been re-run to
# green.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing tag to publish, e.g. v0.31.0'
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  gate:
    name: The tagged commit has a green Tests run
    runs-on: ubuntu-latest
    # Long enough to wait for a Tests run that started with the tag.
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - name: The tag is spelled like a release
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.]*$'; then
            echo "::error::'$TAG' is not a release tag (expected v<major>.<minor>.<patch>)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      # The tag has to be `v` + the version pyproject.toml declares, and the
      # changelog needs a section for that version. The tool that writes the
      # release text checks both; here only its exit code is wanted.
      - name: The tag, pyproject.toml and the changelog describe one release
        run: python3 tools/release_notes.py "$TAG" --repository "$GITHUB_REPOSITORY" > /dev/null

      - name: Wait for a green Tests run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "the tag $TAG is the commit $sha"

          runs() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow tests.yml --commit "$sha" \
              --limit 20 --json databaseId,status,conclusion --jq "$1"
          }

          # A run that was pushed together with the tag may not be listed yet.
          count=0
          for attempt in 1 2 3 4 5 6; do
            count="$(runs 'length')"
            if [ "$count" -gt 0 ]; then break; fi
            echo "no Tests run is listed for this commit yet (look $attempt of 6)"
            sleep 20
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::No run of the Tests workflow exists for $sha. Push the commit to main without [skip ci], let the run turn green, then run this workflow for $TAG again."
            exit 1
          fi

          if [ "$(runs '[.[] | select(.conclusion == "success")] | length')" -gt 0 ]; then
            echo "a Tests run on this commit is green"
            exit 0
          fi

          running="$(runs '[.[] | select(.status != "completed")][0].databaseId // empty')"
          if [ -n "$running" ]; then
            echo "waiting for the Tests run $running"
            gh run watch "$running" --repo "$GITHUB_REPOSITORY" --interval 60 > /dev/null || true
            conclusion="$(gh run view "$running" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')"
            if [ "$conclusion" = "success" ]; then
              echo "the Tests run $running is green"
              exit 0
            fi
            echo "::error::The Tests run $running ended '$conclusion'. Nothing is published. Re-run its failed jobs; when it is green, run this workflow for $TAG again."
            exit 1
          fi

          echo "::error::No Tests run on $sha is green. Nothing is published. Re-run the failed jobs of the Tests run; when it is green, run this workflow for $TAG again."
          exit 1

  publish:
    name: Build, upload to PyPI, create the GitHub Release
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # to create the GitHub Release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build unicode-logic-kit and the forwarder for the former name
        run: |
          python -m build --outdir dist
          python -m build unicode-fol-kit --outdir dist
          twine check dist/*
          ls -l dist

      # `--verbose` prints what PyPI answers to a refused upload. Without it
      # twine reports the status alone ("403 Forbidden"), and whether the token
      # is unknown, bound to another project or the name is refused stays open.
      # The token itself is not printed.
      - name: Upload unicode-logic-kit
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/unicode_logic_kit-* --non-interactive --skip-existing --verbose

      # Second, so that the forwarder is never on PyPI without the package it
      # depends on.
      - name: Upload unicode-fol-kit, the forwarder for the former name
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/unicode_fol_kit-* --non-interactive --skip-existing --verbose

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "the release $TAG exists already"
            exit 0
          fi
          python tools/release_notes.py "$TAG" --repository "$GITHUB_REPOSITORY" > release-notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Release $TAG" --notes-file release-notes.md
