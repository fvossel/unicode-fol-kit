[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unicode-fol-kit"
version = "0.17.0"
description = "Parser and toolkit for first-order logic formulas using Unicode operators"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Felix Vossel", email = "felixvossel@gmail.com" },
]
keywords = ["logic", "fol", "first-order-logic", "parser", "lukasiewicz", "lambda-calculus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "lark>=1.1",
    "z3-solver>=4.12",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "myst-parser>=2.0",
]
test = [
    "pytest>=7.0",
    "pytest-xdist>=3.0",   # parallel test runs: pytest -n auto (the suite is Z3-bound)
]

[project.urls]
Documentation = "https://unicode-fol-kit.readthedocs.io/"
Repository = "https://github.com/fvossel/unicode-fol-kit"
Issues = "https://github.com/fvossel/unicode-fol-kit/issues"

[tool.pytest.ini_options]
markers = [
    # The everyday developer loop is `pytest -n auto -m "not isabelle_live"`:
    # the live tests each spawn a fresh `isabelle build` subprocess (minutes of
    # wall time on a machine with Isabelle installed) and dominate the serial
    # suite time. CI and pre-release runs cover them with a SERIAL
    # `pytest -m isabelle_live` — even `-n 4` makes concurrent JVM builds
    # contend for CPU and push long proof batteries (S4.3 ~70 s) past their
    # session timeouts, producing flaky failures. Never put `-n` in addopts.
    "isabelle_live: exercises a real Isabelle/HOL installation via isabelle_runner (slow subprocess builds; skipped automatically when isabelle_available() is False)",
]

[tool.hatch.build.targets.wheel]
packages = ["unicode_fol_kit"]

[tool.hatch.build.targets.sdist]
include = [
    "/unicode_fol_kit",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]
exclude = [
    "/docs/_build",
    "/docs/_autosummary",
]
