[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unicode-fol-kit"
version = "0.11.0"
description = "Parser and toolkit for first-order logic formulas using Unicode operators"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Felix Vossel", email = "felixvossel@gmail.com" },
]
keywords = ["logic", "fol", "first-order-logic", "parser", "lukasiewicz", "lambda-calculus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "lark>=1.1",
    "z3-solver>=4.12",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "myst-parser>=2.0",
]
test = [
    "pytest>=7.0",
    "pytest-xdist>=3.0",   # parallel test runs: pytest -n auto (the suite is Z3-bound)
]

[project.urls]
Documentation = "https://unicode-fol-kit.readthedocs.io/"
Repository = "https://github.com/fvossel/unicode-fol-kit"
Issues = "https://github.com/fvossel/unicode-fol-kit/issues"

[tool.hatch.build.targets.wheel]
packages = ["unicode_fol_kit"]

[tool.hatch.build.targets.sdist]
include = [
    "/unicode_fol_kit",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]
exclude = [
    "/docs/_build",
    "/docs/_autosummary",
]
